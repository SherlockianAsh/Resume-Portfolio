<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashlock Tech Solutions — Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; background:#e7e3da; font-family:'JetBrains Mono',monospace; padding:48px; }
  .board{ max-width:1180px; }
  .kicker{ font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:#9a7d3a; }
  h1{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:44px; color:#1d1810; margin:8px 0 28px; }
  .rowlabel{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:#8a7a55; margin:40px 0 14px; }
  .row{ display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
  .tile{ border-radius:4px; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .dark{ background:radial-gradient(700px 400px at 70% 0%, rgba(201,164,76,.12), transparent 60%), #14110b; }
  .cream{ background:#fbf9f4; }
  .center{ display:flex; align-items:center; justify-content:center; }
  .col{ flex-direction:column; gap:26px; }
  /* lockup type */
  .wm{ font-family:'Cormorant Garamond',serif; font-weight:600; letter-spacing:.04em; line-height:1; }
  .tag{ font-family:'JetBrains Mono',monospace; text-transform:uppercase; }
</style>
</head>
<body>
<div class="board">
  <div class="kicker">Identity · Ashlock Tech Solutions</div>
  <h1>The Lens That Reads Code</h1>

  <!-- ROW 1: primary mark -->
  <div class="rowlabel">01 · Primary Mark</div>
  <div class="row">
    <!-- hero gold on night -->
    <div class="tile dark center col" style="width:520px; height:420px;">
      <svg viewBox="0 0 120 120" width="184" height="184" fill="none">
        <circle cx="50" cy="50" r="38" stroke="#c9a44c" stroke-width="5.5"/>
        <line x1="78" y1="78" x2="104" y2="104" stroke="#c9a44c" stroke-width="9" stroke-linecap="round"/>
        <path d="M34 40 l13 10 l-13 10" stroke="#dcc488" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="52" y="58" width="20" height="5.5" rx="2.5" fill="#dcc488"/>
      </svg>
      <div style="text-align:center;">
        <div class="wm" style="font-size:30px; color:#f3eddd;">ASHLOCK</div>
        <div class="wm" style="font-size:30px; color:#f3eddd; margin-top:2px;">TECH SOLUTIONS</div>
        <div class="tag" style="font-size:9.5px; letter-spacing:.34em; color:#c9a44c; margin-top:12px;">We Investigate, Then We Build</div>
      </div>
    </div>
    <!-- construction grid -->
    <div class="tile cream center" style="width:340px; height:420px;">
      <svg viewBox="0 0 120 120" width="240" height="240" fill="none">
        <defs><pattern id="g" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" stroke="#e4ddcd" stroke-width="1"/></pattern></defs>
        <rect x="6" y="6" width="108" height="108" fill="url(#g)"/>
        <circle cx="50" cy="50" r="38" stroke="#cdbf9f" stroke-width="1" stroke-dasharray="3 3"/>
        <circle cx="50" cy="50" r="38" stroke="#1d1810" stroke-width="4"/>
        <line x1="78" y1="78" x2="104" y2="104" stroke="#1d1810" stroke-width="7" stroke-linecap="round"/>
        <path d="M34 40 l13 10 l-13 10" stroke="#a8332a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="52" y="58" width="20" height="4.5" rx="2" fill="#a8332a"/>
      </svg>
    </div>
  </div>

  <!-- ROW 2: lockups -->
  <div class="rowlabel">02 · Lockups</div>
  <div class="row">
    <!-- horizontal, ink on cream -->
    <div class="tile cream" style="width:520px; height:130px; display:flex; align-items:center; gap:18px; padding:0 30px;">
      <svg viewBox="0 0 120 120" width="64" height="64" fill="none">
        <circle cx="50" cy="50" r="38" stroke="#1d1810" stroke-width="6"/>
        <line x1="78" y1="78" x2="104" y2="104" stroke="#1d1810" stroke-width="9.5" stroke-linecap="round"/>
        <path d="M34 40 l13 10 l-13 10" stroke="#a8332a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="52" y="58" width="20" height="6" rx="3" fill="#a8332a"/>
      </svg>
      <div style="width:1px; height:52px; background:#ddd4c0;"></div>
      <div>
        <div class="wm" style="font-size:26px; color:#1d1810;">ASHLOCK TECH SOLUTIONS</div>
        <div class="tag" style="font-size:9px; letter-spacing:.3em; color:#9a7d3a; margin-top:6px;">We Investigate, Then We Build</div>
      </div>
    </div>
    <!-- favicon strip ink -->
    <div class="tile cream center col" style="width:340px; height:130px; gap:10px;">
      <div class="tag" style="font-size:8.5px; letter-spacing:.18em; color:#b3a585;">SCALES TO 16PX</div>
      <div style="display:flex; align-items:flex-end; gap:14px;">
        <svg viewBox="0 0 120 120" width="48" height="48" fill="none"><circle cx="50" cy="50" r="38" stroke="#1d1810" stroke-width="6"/><line x1="78" y1="78" x2="104" y2="104" stroke="#1d1810" stroke-width="9.5" stroke-linecap="round"/><path d="M34 40 l13 10 l-13 10" stroke="#1d1810" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="52" y="58" width="20" height="6" rx="3" fill="#1d1810"/></svg>
        <svg viewBox="0 0 120 120" width="30" height="30" fill="none"><circle cx="50" cy="50" r="38" stroke="#1d1810" stroke-width="7"/><line x1="78" y1="78" x2="104" y2="104" stroke="#1d1810" stroke-width="11" stroke-linecap="round"/><path d="M34 40 l13 10 l-13 10" stroke="#1d1810" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 120 120" width="18" height="18" fill="none"><circle cx="50" cy="50" r="38" stroke="#1d1810" stroke-width="8"/><line x1="78" y1="78" x2="104" y2="104" stroke="#1d1810" stroke-width="13" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>

  <!-- ROW 3: colour finishes -->
  <div class="rowlabel">03 · Four Finishes</div>
  <div class="row">
    <div class="tile dark center" style="width:200px; height:180px;"><svg viewBox="0 0 120 120" width="92" height="92" fill="none"><circle cx="50" cy="50" r="38" stroke="#c9a44c" stroke-width="5.5"/><line x1="78" y1="78" x2="104" y2="104" stroke="#c9a44c" stroke-width="9" stroke-linecap="round"/><path d="M34 40 l13 10 l-13 10" stroke="#dcc488" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="52" y="58" width="20" height="5.5" rx="2.5" fill="#dcc488"/></svg></div>
    <div class="tile center" style="width:200px; height:180px; background:#f3eddd;"><svg viewBox="0 0 120 120" width="92" height="92" fill="none"><circle cx="50" cy="50" r="38" stroke="#1d1810" stroke-width="5.5"/><line x1="78" y1="78" x2="104" y2="104" stroke="#1d1810" stroke-width="9" stroke-linecap="round"/><path d="M34 40 l13 10 l-13 10" stroke="#1d1810" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="52" y="58" width="20" height="5.5" rx="2.5" fill="#1d1810"/></svg></div>
    <div class="tile center" style="width:200px; height:180px; background:linear-gradient(168deg,#d4b884,#bf9f68);"><svg viewBox="0 0 120 120" width="92" height="92" fill="none" opacity="0.82" style="transform:rotate(-7deg)"><circle cx="50" cy="50" r="38" stroke="#a8332a" stroke-width="5.5"/><line x1="78" y1="78" x2="104" y2="104" stroke="#a8332a" stroke-width="9" stroke-linecap="round"/><path d="M34 40 l13 10 l-13 10" stroke="#a8332a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="52" y="58" width="20" height="5.5" rx="2.5" fill="#a8332a"/></svg></div>
    <div class="tile center" style="width:200px; height:180px; background:#c9a44c;"><svg viewBox="0 0 120 120" width="92" height="92" fill="none"><circle cx="50" cy="50" r="38" stroke="#14110b" stroke-width="5.5"/><line x1="78" y1="78" x2="104" y2="104" stroke="#14110b" stroke-width="9" stroke-linecap="round"/><path d="M34 40 l13 10 l-13 10" stroke="#14110b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="52" y="58" width="20" height="5.5" rx="2.5" fill="#14110b"/></svg></div>
  </div>

  <!-- ROW 4: app icon (this tile is rendered to PNG for /shinsho --ref) -->
  <div class="rowlabel">04 · App Icon (shinsho reference)</div>
  <div class="row">
    <div id="appicon" style="width:512px; height:512px; border-radius:112px; background:radial-gradient(420px 320px at 30% 20%, #20190d, #14110b); box-shadow:0 18px 40px rgba(0,0,0,.4), inset 0 2px 0 rgba(201,164,76,.25); display:flex; align-items:center; justify-content:center;">
      <svg viewBox="0 0 120 120" width="300" height="300" fill="none">
        <circle cx="50" cy="50" r="38" stroke="#c9a44c" stroke-width="6"/>
        <line x1="78" y1="78" x2="104" y2="104" stroke="#c9a44c" stroke-width="10" stroke-linecap="round"/>
        <path d="M34 40 l13 10 l-13 10" stroke="#dcc488" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="52" y="58" width="20" height="6" rx="3" fill="#dcc488"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
